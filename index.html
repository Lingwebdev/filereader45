
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>File Download Center</title>
</head>

<body>

    <h3>File Download Center</h3>

    <!-- File Window -->
    <iframe
        id="fileWindow"
        src="/file-list"
        width="550"
        height="180"
        title="Available files">
    </iframe>

    <br><br>

    <!-- Load Files Button -->
    <button onclick="loadFiles()">
        Upload / Refresh Files
    </button>

    <p id="message"></p>

    <script>

        function loadFiles() {

            const windowFrame =
                document.getElementById("fileWindow");

            // Refresh the contents of the files folder
            windowFrame.src =
                "/file-list?t=" + new Date().getTime();

            document.getElementById("message").textContent =
                "File list refreshed.";

        }

    </script>

</body>
</html>
